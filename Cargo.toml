[package]
name = "fwrolloutd"
version = "2.1.0"
edition = "2021"
repository = "https://github.com/husqvarnagroup/smart-garden-gateway-fwrolloutd"
license-file = "LICENSE"
rust-version = "1.75.0"

[[bin]]
name = "fwrolloutd"
path = "src/main.rs"

[lib]
path = "lib/ipso_registry.rs"

[dependencies]
anyhow = "1.0"
argh = "0.1"
async-compression = { version = "0.4.18", features = ["futures-io", "gzip", "tokio"] }
async-tar = "0.5.0"
bytes = "1.2"
# NOTE: just as with lemonbeatd, there's currently no proper way to update the timezone
chrono = "= 0.4.19"
futures = "0.3.28"
futures-util = "0.3.28"
gardenalog = { git = "https://github.com/husqvarnagroup/smart-garden-gateway-crates.git" }
lazy_static = "1.4"
lwm2m = { git = "https://github.com/husqvarnagroup/smart-garden-gateway-crates.git" }
num-traits = "0.2"
rand = "0.8"
reqwest = { version = "0.12.12", features = ["gzip", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sg-ipc =  { git = "https://github.com/husqvarnagroup/smart-garden-gateway-crates.git" }
tokio = { version = "1.0", features = ["fs", "macros", "process", "rt", "signal"] }
tokio-util = { version = "0.7.8", features = ["io"] }
tracing = "0.1"
url = { version = "2.3", features = ["serde"] }

[dev-dependencies]
async-global-executor = "2.4.1"
tempdir = "0.3.7"
wiremock = "0.6.2"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
