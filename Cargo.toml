[package]
name = "fwrolloutd"
version = "2.1.0"
edition = "2021"
repository = "https://github.com/husqvarnagroup/smart-garden-gateway-fwrolloutd"
license-file = "LICENSE"
rust-version = "1.75.0"

[[bin]]
name = "fwrolloutd"
path = "src/main.rs"

[lib]
path = "lib/ipso_registry.rs"

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
argh = { version = "0.1", default-features = false }
async-compression = { version = "0.4.18", default-features = false, features = ["futures-io", "gzip", "tokio"] }
async-tar = { version = "0.5.0", default-features = false }
bytes = { version = "1.2", default-features = false }
# NOTE: just as with lemonbeatd, there's currently no proper way to update the timezone
chrono = { version = "= 0.4.19", default-features = false, features = ["clock"] }
futures = { version = "0.3.28", default-features = false, features = ["std"] }
futures-util = { version = "0.3.28", default-features = false, features = ["std"] }
gardenalog = { git = "https://github.com/husqvarnagroup/smart-garden-gateway-crates.git", default-features = false }
lazy_static = { version = "1.4", default-features = false }
lwm2m = { git = "https://github.com/husqvarnagroup/smart-garden-gateway-crates.git", default-features = false }
num-traits = { version = "0.2", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
reqwest = { version = "0.12.12", default-features = false, features = ["default-tls", "gzip", "json", "stream"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_yaml = { version = "0.9", default-features = false }
sg-ipc =  { git = "https://github.com/husqvarnagroup/smart-garden-gateway-crates.git", default-features = false }
tokio = { version = "1.0", default-features = false, features = ["fs", "io-util", "macros", "rt", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["attributes", "std"] }
url = { version = "2.3", default-features = false, features = ["serde", "std"] }

[dev-dependencies]
async-global-executor = "2.4.1"
tempdir = "0.3.7"
wiremock = "0.6.2"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
